server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: cloud
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    vectorstore:
      pgvector:
        table-name: ${PGVECTOR_TABLE_NAME:vector_store}
        distance-type: COSINE_DISTANCE
        initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:false}

langfuse:
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  host: ${LANGFUSE_HOST:http://localhost:3000}
  management:
    tracing:
      sampling:
        probability: 1.0
    otlp:
      tracing:
        endpoint: http://localhost:3000/api/public/otel/v1/traces
        headers:
          Authorization: cGstbGYteHh4eDpzay1sZi14eHh4
  spring:
    ai:
      chat:
        client:
          observations:
            include-input: true

mcp:
  antigravity:
    enabled: ${MCP_ANTIGRAVITY_ENABLED:false}
    endpoint: ${MCP_ANTIGRAVITY_ENDPOINT:}
    token: ${MCP_ANTIGRAVITY_TOKEN:}
